name: F1.1.3 MySQL Migration Verification

on:
  push:
    branches:
      - test/migration-recovery-f113
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f113-mysql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: f113-test-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: daway_f113_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pf113-test-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: daway_f113_test
      DB_USERNAME: root
      DB_PASSWORD: f113-test-only-password
      DB_URL: ''
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies without Composer scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Generate an ephemeral test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Apply migrations to the disposable MySQL service
        run: php artisan migrate --force --no-interaction

      - name: Verify MySQL schema, partial recovery, and rollback guards
        run: php artisan test tests/Feature/Migrations/MySqlMigrationRecoveryTest.php

  mysql-api-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: f113-test-only-password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: daway_f113_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pf113-test-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: daway_f113_test
      DB_USERNAME: root
      DB_PASSWORD: f113-test-only-password
      DB_URL: ''
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, zip
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies without Composer scripts
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Discover Laravel packages
        run: php artisan package:discover --ansi

      - name: Generate an ephemeral test application key
        run: echo "APP_KEY=$(php artisan key:generate --show)" >> "$GITHUB_ENV"

      - name: Run MySQL-backed API regressions
        run: >-
          php artisan test
          tests/Feature/Api/LocalMedicineBarcodeTest.php
          tests/Feature/Api/Pharmacy/AccountingPurchaseApiTest.php
          tests/Feature/Api/Payment/AmountReconciliationTest.php
          tests/Feature/Api/Notifications/OrderNotificationFlowTest.php
