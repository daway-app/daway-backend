name: Authentication foundation tests
on:
  pull_request:
    branches: [develop]
    paths:
      - 'app/Http/Controllers/Api/*Auth*'
      - 'app/Http/Controllers/Api/EmailPasswordResetController.php'
      - 'app/Notifications/ApiPasswordResetNotification.php'
      - 'app/Services/Auth/**'
      - 'config/services.php'
      - 'composer.json'
      - 'composer.lock'
      - 'bootstrap/app.php'
      - 'routes/api.php'
      - 'database/migrations/*password*'
      - 'tests/Feature/Api/*Password*'
      - 'tests/Feature/Api/GoogleIdentityVerifierTest.php'
      - '.github/workflows/auth-foundation.yml'
permissions:
  contents: read
jobs:
  targeted-auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, dom, gd, zip, bcmath, ctype, curl, fileinfo, json, pdo, pdo_sqlite, sqlite3, tokenizer, openssl, iconv, intl
      - run: cp .env.example .env
      - run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --ignore-platform-reqs
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite
      - name: Run focused auth tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan test --filter='PatientPasswordAuthTest|EmailPasswordResetTest|GoogleIdentityVerifierTest'
