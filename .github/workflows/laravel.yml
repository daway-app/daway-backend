name: Laravel

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود أولاً
      - uses: actions/checkout@v4

      # 2. إعداد بيئة PHP (استخدم 8.3 إلا إذا كنت متأكداً أن مشروعك يدعم 8.4)
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, gd, zip, bcmath, ctype, curl, fileinfo, json, pdo, pdo_sqlite, sqlite3, tokenizer, openssl, iconv, intl

      # 3. نسخ ملف البيئة
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # 4. تثبيت المكتبيات
      - name: Install Dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # 5. توليد المفتاح وصلاحيات المجلدات
      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # 6. إنشاء قاعدة بيانات SQLite
      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

      # 7. تشغيل الاختبارات بمسار مطلق للقاعدة
      - name: Execute tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: php artisan test
