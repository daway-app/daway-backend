<script>
(function () {
  var out = [];
  var pass = 0, fail = 0;

  function ck(label, actual, expected) {
    var ok = JSON.stringify(actual) === JSON.stringify(expected);
    if (ok) { pass++; out.push('  \u2713 ' + label); }
    else {
      fail++;
      out.push('  \u2717 ' + label + '  (متوقّع ' + JSON.stringify(expected) +
               '، فعلي ' + JSON.stringify(actual) + ')');
    }
  }

  function finish() {
    document.getElementById('__out').innerHTML =
      out.join('<br>').replace(/\u2713/g, '<span class="ok">\u2713</span>')
                       .replace(/\u2717/g, '<span class="bad">\u2717</span>');
    document.getElementById('__M').textContent =
      'RESULT pass=' + pass + ' fail=' + fail;
  }

  try {
    out.push('<b>1) الموديولات محمّلة من حِزَم البناء الحقيقية</b>');
    ck('AccountingScanSession موجود', typeof window.AccountingScanSession, 'object');
    ck('AccountingBarcode موجود', typeof window.AccountingBarcode, 'object');
    ck('AccountingPhoneScanner موجود', typeof window.AccountingPhoneScanner, 'object');
    ck('AccountingUtil موجود', typeof window.AccountingUtil, 'object');
    ck('AccountingApi موجود', typeof window.AccountingApi, 'object');

    out.push('<b>2) الحالات التسع في الحزمة المبنية</b>');
    var S = window.AccountingScanSession;
    ck('9 حالات', S.allStates().length, 9);
    ck('idle حاضرة', S.allStates().indexOf('idle') >= 0, true);

    out.push('<b>3) createController يُصدّر markReceived (الانتقال الصريح)</b>');
    var c = S.createController();
    ck('markReceived دالة', typeof c.markReceived, 'function');
    ck('resolve دالة', typeof c.resolve, 'function');

    out.push('<b>4) 🔴 غياب scanSessions ⇒ unavailable لا error</b>');
    c.start().then(function (snap) {
      ck('mode = unavailable', snap.mode, 'unavailable');
      ck('status = waiting', snap.status, 'waiting');
      ck('error = no_backend', snap.error, 'no_backend');

      out.push('<b>5) markReceived تُطلق حدث state (لا كتابة مباشرة)</b>');
      var events = [];
      c.onChange(function (type, p, s) { events.push(type + ':' + (s && s.status)); });
      c.markReceived('6281001001234');
      ck('الحالة received', c.snapshot().status, 'received');
      ck('حدث state:received أُطلق', events.indexOf('state:received') >= 0, true);

      out.push('<b>6) DOM: عناصر الأجهزة حاضرة ومُتحكَّم بها</b>');
      ck('data-device-row موجود', !!document.querySelector('[data-device-row]'), true);
      ck('data-device-disconnect موجود', !!document.querySelector('[data-device-disconnect]'), true);
      ck('data-device-allow موجود', !!document.querySelector('[data-device-allow]'), true);
      ck('data-pair-qr-placeholder موجود', !!document.querySelector('[data-pair-qr-placeholder]'), true);

      out.push('<b>7) بلا Backend وبلا mock ⇒ unavailable صريح (لا error)</b>');
      return c.close().then(function () {
        ck('close() لا يرمي', true, true);
        finish();
      });
    }).catch(function (e) {
      out.push('<span class="bad">استثناء: ' + e + '</span>');
      fail++;
      finish();
    });
  } catch (e) {
    out.push('<span class="bad">استثناء عام: ' + e + '</span>');
    document.getElementById('__M').textContent = 'RESULT pass=0 fail=1 error=' + e;
    finish();
  }
})();
</script>
</body>
</html>
