services:
  - type: web
    name: daway-backend
    runtime: php
    plan: free
    buildCommand: composer install --no-dev
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # القيمة الحقيقية لـ APP_KEY تُضاف من Render Dashboard (Environment) — لا تُرفع للمستودع
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: dway-db-daway.l.aivencloud.com
      - key: DB_PORT
        value: "28123"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      # كلمة مرور القاعدة تُضاف من Render Dashboard (Environment) — لا تُرفع للمستودع
      - key: MYSQL_ATTR_SSL_CA
        value: /opt/render/project/src/database/certs/ca.pem
      - key: DB_POOL
        value: "3"
      - key: CACHE_STORE
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # سجل الأخطاء على stderr حتى يظهر في لوحة تحكم Render (ملفات السجل غير مرئية)
      - key: LOG_CHANNEL
        value: stderr
      # البروكسي الموثوق — يُضيَّق لاحقاً على نطاقات Render الرسمية إذا عُرفت
      - key: TRUSTED_PROXIES
        value: "*"
      # عيّن القيمة من Render Dashboard (مثل https://daway-backend.onrender.com)
      - key: APP_URL
