services:
  - type: web
    name: daway-backend
    runtime: php
    plan: free
    buildCommand: composer install --no-dev
    startCommand: php artisan serve --host=0.0.0.0 --port=10000
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # مطلوب: استبدل هذه القيمة بـ APP_KEY الفعلية من `php artisan key:generate` قبل النشر
      - key: APP_KEY
        value: change-me-generate-via-php-artisan-key-generate
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: YOUR_DB_HOST
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: YOUR_DB_NAME
      - key: DB_USERNAME
        value: YOUR_DB_USER
      - key: DB_PASSWORD
        value: YOUR_DB_PASSWORD
      - key: CACHE_DRIVER
        value: file
