services:
  - type: web
    name: daway-backend
    # H-5: مسار النشر الفعلي هو Dockerfile متعدد المراحل — يُبنى تلقائياً من Dockerfile
    # (لا buildCommand/startCommand: التشغيل والهجرات داخل CMD في الـ Dockerfile)
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # القيمة الحقيقية لـ APP_KEY تُضاف من Render Dashboard (Environment) — لا تُرفع للمستودع
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: dway-db-daway.l.aivencloud.com
      - key: DB_PORT
        value: "28123"
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      # كلمة مرور القاعدة تُضاف من Render Dashboard (Environment) — لا تُرفع للمستودع
      # مسار شهادة SSL داخل حاوية Docker (runtime: docker) — انظر database/certs/ca.pem
      - key: MYSQL_ATTR_SSL_CA
        value: /app/database/certs/ca.pem
      - key: DB_POOL
        value: "3"
      - key: CACHE_STORE
        value: file
      - key: SESSION_SECURE_COOKIE
        value: "true"
      # سجل الأخطاء على stderr حتى يظهر في لوحة تحكم Render (ملفات السجل غير مرئية)
      - key: LOG_CHANNEL
        value: stderr
      # البروكسي الموثوق — يُترك فارغاً عمداً: نطاقات موازن التحميل في Render غير معلنة وغير مستقرة،
      # لذا لا نثق بأي وكيل: IP العميل يُحتسب من REMOTE_ADDR (IP الـ LB).
      # تنبيه: تحديد المعدل لكل IP يتحول إلى دلو مشترك لكل LB (تضعيف الحماية لكل IP) —
      # المعالجة: إضافة تحديد معدل لكل حساب (rate limiting per-account) — مهمة لوكيل الأمان/الـ API.
      - key: TRUSTED_PROXIES
        value: ""
      # عيّن القيمة من Render Dashboard (مثل https://daway-backend.onrender.com)
      - key: APP_URL
      # Sanctum: النطاق الذي تُقبل منه كوكيز الجلسة على /api/*
      # مطلوب لـ /api/sync/token (إصدار توكن المزامنة من جلسة الويب)
      - key: SANCTUM_STATEFUL_DOMAINS
        value: daway-backend-zlh2.onrender.com
      # Firebase Web Push (FCM):
      # - حساب الخدمة: Secret File من Render Dashboard (بلا secret في الريبو)
      #   اسم الملف: firebase-service-account.json → المسار /etc/secrets/firebase-service-account.json
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      # قيم العميل العامة (تُؤخذ من Firebase Console — Project Settings)
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
      # تخزين الصور على Cloudinary (قيم عامة — الرفع غير الموقّع عبر preset)
      - key: CLOUDINARY_CLOUD_NAME
        value: dmvzcwm3g
      - key: CLOUDINARY_UPLOAD_PRESET
        value: daway_medicines
      - key: CLOUDINARY_FOLDER
        value: daway
      # H-15: مساعد الذكاء الاصطناعي وخدمة OCR — تُضبط من Render Dashboard (Environment)
      # المهلة الافتراضية في config/services.php هي 8 ثوانٍ (C-1)
      - key: DAWAY_AI_BASE_URL
        sync: false
      - key: DAWAY_AI_KEY
        sync: false
      - key: DAWAY_AI_TIMEOUT
        value: "8"
      - key: DAWAY_OCR_BASE_URL
        sync: false
      - key: DAWAY_OCR_KEY
        sync: false
      - key: DAWAY_OCR_TIMEOUT
        value: "8"
